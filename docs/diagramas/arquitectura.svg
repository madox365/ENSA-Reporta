<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4a5566"/></marker></defs>
<rect width="1200" height="720" fill="#fff"/>
<text x="600" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#0b2545">ENSA Reporta · Arquitectura de la solución</text>
<!-- usuarios -->
<rect x="30" y="80" width="250" height="110" rx="10" fill="#fff7e0" stroke="#f2a900" stroke-width="2"/>
<text x="155" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#0b2545">Clientes</text>
<text x="155" y="134" text-anchor="middle" font-size="13" fill="#1c2430">Celular o computadora</text>
<text x="155" y="154" text-anchor="middle" font-size="13" fill="#1c2430">PWA instalable · navegador</text>
<text x="155" y="174" text-anchor="middle" font-size="12" fill="#4a5566">Ingreso opcional: suministro + DNI</text>
<rect x="30" y="230" width="250" height="110" rx="10" fill="#e6eef7" stroke="#23609e" stroke-width="2"/>
<text x="155" y="260" text-anchor="middle" font-size="16" font-weight="bold" fill="#0b2545">Personal de ENSA</text>
<text x="155" y="284" text-anchor="middle" font-size="13" fill="#1c2430">Atención al Cliente · áreas técnicas</text>
<text x="155" y="304" text-anchor="middle" font-size="13" fill="#1c2430">Jefatura de TIC · Gerencia</text>
<text x="155" y="324" text-anchor="middle" font-size="12" fill="#4a5566">Cuenta Office 365 (Entra ID)</text>
<!-- DMZ -->
<rect x="330" y="70" width="250" height="280" rx="12" fill="#f5f7fa" stroke="#d9dfe7" stroke-dasharray="6 4"/>
<text x="455" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a5566">Zona desmilitarizada (DMZ)</text>
<rect x="355" y="115" width="200" height="90" rx="8" fill="#fff" stroke="#4a5566" stroke-width="1.5"/>
<text x="455" y="145" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2430">Firewall / WAF</text>
<text x="455" y="167" text-anchor="middle" font-size="12" fill="#4a5566">Solo HTTPS 443</text>
<text x="455" y="185" text-anchor="middle" font-size="12" fill="#4a5566">Filtrado y límite de solicitudes</text>
<rect x="355" y="230" width="200" height="95" rx="8" fill="#fff" stroke="#4a5566" stroke-width="1.5"/>
<text x="455" y="258" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2430">Proxy inverso</text>
<text x="455" y="280" text-anchor="middle" font-size="12" fill="#4a5566">IIS + ARR (o Nginx)</text>
<text x="455" y="298" text-anchor="middle" font-size="12" fill="#4a5566">Certificado TLS de ENSA</text>
<text x="455" y="316" text-anchor="middle" font-size="12" fill="#4a5566">reporta.ensa.com.pe</text>
<!-- servidor app -->
<rect x="630" y="70" width="300" height="420" rx="12" fill="#f3f7fb" stroke="#23609e" stroke-width="2"/>
<text x="780" y="97" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b2545">Servidor de aplicación (centro de datos)</text>
<rect x="655" y="115" width="250" height="70" rx="8" fill="#fff" stroke="#23609e"/>
<text x="780" y="143" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2430">Interfaz web (PWA)</text>
<text x="780" y="165" text-anchor="middle" font-size="12" fill="#4a5566">HTML · CSS · JavaScript</text>
<rect x="655" y="200" width="250" height="150" rx="8" fill="#fff" stroke="#23609e"/>
<text x="780" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2430">API REST · Node.js 22 + Express</text>
<text x="670" y="252" font-size="12" fill="#1c2430">• Registro y agrupación de duplicados</text>
<text x="670" y="272" font-size="12" fill="#1c2430">• Estados, asignación y fusión</text>
<text x="670" y="292" font-size="12" fill="#1c2430">• Ingreso con suministro · sesiones</text>
<text x="670" y="312" font-size="12" fill="#1c2430">• Indicadores y exportación CSV</text>
<text x="670" y="332" font-size="12" fill="#1c2430">• Avisos · auditoría</text>
<rect x="655" y="365" width="250" height="105" rx="8" fill="#fff" stroke="#23609e"/>
<text x="780" y="392" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2430">Base de datos</text>
<text x="780" y="414" text-anchor="middle" font-size="12" fill="#1c2430">Piloto: SQLite (archivo local)</text>
<text x="780" y="434" text-anchor="middle" font-size="12" fill="#1c2430">Producción: SQL Server</text>
<text x="780" y="454" text-anchor="middle" font-size="12" fill="#4a5566">Fotos en carpeta protegida</text>
<!-- servicios existentes -->
<text x="1060" y="97" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b2545">Servicios de ENSA</text>
<rect x="970" y="115" width="200" height="80" rx="8" fill="#fff" stroke="#4a5566"/>
<text x="1070" y="142" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c2430">Mensajes Ensa</text>
<text x="1070" y="162" text-anchor="middle" font-size="12" fill="#4a5566">Envío de SMS</text>
<text x="1070" y="180" text-anchor="middle" font-size="12" fill="#4a5566">a clientes</text>
<rect x="970" y="210" width="200" height="80" rx="8" fill="#fff" stroke="#4a5566"/>
<text x="1070" y="237" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c2430">Office 365</text>
<text x="1070" y="257" text-anchor="middle" font-size="12" fill="#4a5566">Correo (SMTP) e</text>
<text x="1070" y="275" text-anchor="middle" font-size="12" fill="#4a5566">inicio de sesión (Entra ID)</text>
<rect x="970" y="305" width="200" height="80" rx="8" fill="#fff" stroke="#4a5566"/>
<text x="1070" y="332" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c2430">Optimus NGC</text>
<text x="1070" y="352" text-anchor="middle" font-size="12" fill="#4a5566">Exportación periódica</text>
<text x="1070" y="370" text-anchor="middle" font-size="12" fill="#4a5566">del padrón (CSV)</text>
<rect x="970" y="400" width="200" height="80" rx="8" fill="#fff" stroke="#4a5566"/>
<text x="1070" y="427" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c2430">Respaldo y monitoreo</text>
<text x="1070" y="447" text-anchor="middle" font-size="12" fill="#4a5566">Copias diarias · mesa de</text>
<text x="1070" y="465" text-anchor="middle" font-size="12" fill="#4a5566">servicio (Aranda)</text>
<!-- futuro -->
<rect x="630" y="530" width="540" height="100" rx="12" fill="#fff" stroke="#b37d00" stroke-dasharray="6 4"/>
<text x="900" y="558" text-anchor="middle" font-size="14" font-weight="bold" fill="#6b3e00">Integraciones futuras (fuera del alcance del P01)</text>
<text x="900" y="582" text-anchor="middle" font-size="12" fill="#4a5566">INCIDENSA (registro técnico de interrupciones) · nuevo GIS · SCADA → proyecto P04</text>
<text x="900" y="602" text-anchor="middle" font-size="12" fill="#4a5566">Sistema comercial en línea → P07 · Plataforma gob.pe / PIDE</text>
<!-- flechas -->
<path d="M280 135 L352 160" stroke="#4a5566" stroke-width="2" marker-end="url(#f)" fill="none"/>
<path d="M280 285 L352 275" stroke="#4a5566" stroke-width="2" marker-end="url(#f)" fill="none"/>
<path d="M455 205 L455 227" stroke="#4a5566" stroke-width="2" marker-end="url(#f)" fill="none"/>
<path d="M555 277 L652 270" stroke="#4a5566" stroke-width="2" marker-end="url(#f)" fill="none"/>
<text x="603" y="262" text-anchor="middle" font-size="11" fill="#4a5566">HTTP interno</text>
<path d="M780 350 L780 362" stroke="#4a5566" stroke-width="2" marker-end="url(#f)" fill="none"/>
<path d="M905 240 L967 160" stroke="#4a5566" stroke-width="1.6" marker-end="url(#f)" fill="none"/>
<path d="M905 260 L967 250" stroke="#4a5566" stroke-width="1.6" marker-end="url(#f)" fill="none"/>
<path d="M967 345 L908 300" stroke="#4a5566" stroke-width="1.6" marker-end="url(#f)" fill="none"/>
<path d="M908 430 L967 440" stroke="#4a5566" stroke-width="1.6" marker-end="url(#f)" fill="none"/>
<text x="30" y="680" font-size="12" fill="#4a5566">Todo el tráfico externo pasa por HTTPS. La aplicación no se integra en línea con otros sistemas: usa servicios que ENSA ya tiene (SMS, Office 365) y una copia periódica del padrón de suministros.</text>
</svg>
