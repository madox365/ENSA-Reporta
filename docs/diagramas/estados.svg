<text x="690" y="262" font-size="11" fill="#4a5566">fusionar</text>
<text x="30" y="405" font-size="12" fill="#4a5566">Cada cambio queda en el historial con usuario, fecha y comentario. Un reporte nuevo de la misma falla se suma a la incidencia sin cambiar su estado.</text>
