<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4a5566"/></marker></defs>
<rect width="1200" height="640" fill="#fff"/>
<text x="600" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#0b2545">Regla de agrupación de reportes duplicados</text>
<rect x="420" y="60" width="360" height="56" rx="28" fill="#fff7e0" stroke="#b37d00" stroke-width="2"/>
<text x="600" y="94" text-anchor="middle" font-size="15" font-weight="bold" fill="#1c2430">Llega un reporte (tipo, zona, ubicación)</text>
<path d="M600 116 L600 146" stroke="#4a5566" stroke-width="2" marker-end="url(#f)"/>
<rect x="330" y="148" width="540" height="70" rx="8" fill="#e6eef7" stroke="#23609e" stroke-width="2"/>
<text x="600" y="176" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2430">¿Hay incidencias ABIERTAS del mismo tipo y zona</text>
<text x="600" y="198" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2430">registradas dentro de la ventana del tipo?</text>
<path d="M870 183 L990 183 L990 520" stroke="#4a5566" stroke-width="2" fill="none" marker-end="url(#f)"/>
<text x="930" y="174" text-anchor="middle" font-size="13" fill="#b42318" font-weight="bold">No</text>
<path d="M600 218 L600 248" stroke="#4a5566" stroke-width="2" marker-end="url(#f)"/>
<text x="618" y="238" font-size="13" fill="#1e7b46" font-weight="bold">Sí</text>
<text x="600" y="270" text-anchor="middle" font-size="13" fill="#4a5566">Se compara con cada reporte de esas incidencias, en este orden:</text>
<rect x="60" y="290" width="250" height="110" rx="8" fill="#fff" stroke="#23609e" stroke-width="1.6"/>
<text x="185" y="316" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b2545">1 · Misma subestación</text>
<text x="185" y="340" text-anchor="middle" font-size="12" fill="#1c2430">Solo cortes y luz baja.</text>
<text x="185" y="360" text-anchor="middle" font-size="12" fill="#1c2430">Ambos suministros tienen</text>
<text x="185" y="380" text-anchor="middle" font-size="12" fill="#1c2430">la misma SED en el padrón</text>
<rect x="330" y="290" width="250" height="110" rx="8" fill="#fff" stroke="#23609e" stroke-width="1.6"/>
<text x="455" y="316" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b2545">2 · Distancia GPS</text>
<text x="455" y="340" text-anchor="middle" font-size="12" fill="#1c2430">Distancia ≤ radio del tipo</text>
<text x="455" y="360" text-anchor="middle" font-size="12" fill="#1c2430">(corte 800 m, tensión 300 m,</text>
<text x="455" y="380" text-anchor="middle" font-size="12" fill="#1c2430">cable/alumbrado 150/120 m, poste 100 m)</text>
<rect x="600" y="290" width="250" height="110" rx="8" fill="#fff" stroke="#23609e" stroke-width="1.6"/>
<text x="725" y="316" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b2545">3 · Mismo suministro</text>
<text x="725" y="340" text-anchor="middle" font-size="12" fill="#1c2430">Mismo número de suministro</text>
<text x="725" y="360" text-anchor="middle" font-size="12" fill="#1c2430">(el cliente reporta otra vez</text>
<text x="725" y="380" text-anchor="middle" font-size="12" fill="#1c2430">por otro canal)</text>
<rect x="870" y="290" width="250" height="110" rx="8" fill="#fff" stroke="#23609e" stroke-width="1.6"/>
<text x="995" y="316" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b2545">4 · Dirección parecida</text>
<text x="995" y="340" text-anchor="middle" font-size="12" fill="#1c2430">Similitud de palabras ≥ 50%</text>
<text x="995" y="360" text-anchor="middle" font-size="12" fill="#1c2430">(normaliza Av., Ca., Jr., tildes</text>
<text x="995" y="380" text-anchor="middle" font-size="12" fill="#1c2430">y palabras vacías)</text>
<path d="M310 345 L327 345" stroke="#4a5566" stroke-width="1.6" marker-end="url(#f)"/>
<path d="M580 345 L597 345" stroke="#4a5566" stroke-width="1.6" marker-end="url(#f)"/>
<path d="M850 345 L867 345" stroke="#4a5566" stroke-width="1.6" marker-end="url(#f)"/>
<path d="M455 400 L455 470" stroke="#4a5566" stroke-width="2" marker-end="url(#f)"/>
<text x="470" y="440" font-size="12" fill="#4a5566">si coincide alguno: se toma la mejor coincidencia</text>
<rect x="120" y="472" width="620" height="90" rx="10" fill="#e7f4ec" stroke="#1e7b46" stroke-width="2"/>
<text x="430" y="502" text-anchor="middle" font-size="15" font-weight="bold" fill="#134d2c">Se suma a la incidencia existente</text>
<text x="430" y="526" text-anchor="middle" font-size="12" fill="#1c2430">El cliente recibe su propio número de seguimiento; el reporte queda marcado</text>
<text x="430" y="546" text-anchor="middle" font-size="12" fill="#1c2430">como duplicado (agrupación automática) y se registra el criterio en el historial.</text>
<rect x="830" y="522" width="320" height="70" rx="10" fill="#fff7e0" stroke="#b37d00" stroke-width="2"/>
<text x="990" y="552" text-anchor="middle" font-size="15" font-weight="bold" fill="#5a3e00">Se abre una incidencia nueva</text>
<text x="990" y="574" text-anchor="middle" font-size="12" fill="#1c2430">si ningún criterio coincide</text>
<text x="30" y="620" font-size="12" fill="#4a5566">Si el sistema no detecta un duplicado, el personal lo une con "Fusionar"; esos casos se cuentan como agrupación manual en el KPI 2.</text>
</svg>
