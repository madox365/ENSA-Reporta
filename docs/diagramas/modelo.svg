<path d="M350 465 L400 465 L400 330 L450 330"/><text x="356" y="458" fill="#4a5566" stroke="none">1</text><text x="436" y="324" fill="#4a5566" stroke="none">N</text>
<path d="M350 600 L450 560" stroke-dasharray="5 4"/><text x="362" y="622" fill="#4a5566" stroke="none">suministro / sed</text>
<path d="M750 135 L850 135"/><text x="756" y="128" fill="#4a5566" stroke="none">1</text><text x="836" y="128" fill="#4a5566" stroke="none">N</text>
<path d="M750 520 L850 500"/><text x="756" y="512" fill="#4a5566" stroke="none">1</text><text x="836" y="492" fill="#4a5566" stroke="none">N</text>
<path d="M995 390 L995 430" stroke-dasharray="3 3"/>
<path d="M995 560 L995 600" stroke-dasharray="3 3"/>
</g>
</svg>
